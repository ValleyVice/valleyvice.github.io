<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Essay Title</title>
  <style>
    :root{
      --bg:#0b0b10;
      --panel:#14141c;
      --text:#ece7e0;
      --muted:#a6a0af;
      --accent:#d7a7ff;
      --border:rgba(215,167,255,.24);
      --shadow:0 18px 60px rgba(0,0,0,.45);
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family: Georgia, "Times New Roman", serif;
      line-height:1.85;
      -webkit-font-smoothing:antialiased;
    }

    .wrap{
      max-width:860px;
      margin:0 auto;
      padding:28px 20px 72px;
    }

    .topbar{
      display:flex;
      flex-wrap:wrap;
      gap:14px;
      justify-content:space-between;
      align-items:center;
      margin-bottom:26px;
      font-family: ui-monospace, monospace;
      font-size:12px;
      letter-spacing:.14em;
      text-transform:uppercase;
      color:var(--muted);
    }

    .topbar a{
      color:var(--muted);
      text-decoration:none;
    }

    .topbar a:hover{
      color:var(--accent);
    }

    .hero{
      background:linear-gradient(180deg, rgba(255,255,255,.03), transparent), var(--panel);
      border:1px solid var(--border);
      border-radius:18px;
      padding:34px 28px;
      box-shadow:var(--shadow);
      margin-bottom:22px;
    }

    .kicker{
      font-family: ui-monospace, monospace;
      font-size:11px;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:var(--accent);
      margin-bottom:10px;
    }

    h1{
      margin:0 0 10px;
      font-size:clamp(2rem, 4vw, 3.2rem);
      line-height:1.08;
    }

    .meta{
      margin:0;
      color:var(--muted);
      font-size:.98rem;
    }

    article{
      background:rgba(255,255,255,.02);
      border:1px solid rgba(255,255,255,.08);
      border-radius:18px;
      padding:34px 30px;
      box-shadow:var(--shadow);
    }

    article .content{
      max-width:62ch;
      margin:0 auto;
      font-size:1.08rem;
    }

    article p{
      margin:0 0 1.25em;
    }

    article p:first-of-type::first-letter{
      float:left;
      font-size:3.6rem;
      line-height:.85;
      padding-right:.12em;
      color:var(--accent);
    }

    h2{
      margin:1.8em 0 .6em;
      font-family: ui-monospace, monospace;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:var(--accent);
      font-size:.9rem;
    }

    a{ color:#f0c9ff; }

    .footer{
      margin-top:18px;
      text-align:center;
      color:var(--muted);
      font-size:.9rem;
      opacity:.9;
    }

    @media (max-width: 640px){
      .wrap{ padding-inline:14px; }
      .hero, article{ padding:22px 18px; border-radius:16px; }
      .topbar{ gap:10px; }
      article .content{ font-size:1.03rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="topbar">
      <a href="/">HOME</a>
      <a href="/writing.html">WRITING</a>
      <a href="/poetry.html">POETRY</a>
      <a href="/essays.html">ESSAYS</a>
      <a href="/visuals.html">VISUALS</a>
      <a href="/music.html">MUSIC</a>
    </nav>

    <section class="hero">
      <div class="kicker">Essay</div>
      <h1>Essay Title</h1>
      <p class="meta">Optional subtitle or date</p>
    </section>

    <article>
      <div class="content">
        <p>Paste your introduction here.</p>

        <h2>Section Title</h2>
        <p>Paste body paragraphs here. This layout keeps the text centered, readable, and calm.</p>

        <p>Add more paragraphs as needed.</p>
      </div>
    </article>

    <div class="footer">End of essay</div>
  </div>
</body>
</html>
